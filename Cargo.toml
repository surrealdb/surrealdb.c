[package]
name = "surrealdb_c"
version = "0.2.6"
edition = "2021"
authors = ["Tobie Morgan Hitchcock <tobie@surrealdb.com>"]
description = "The official SurrealDB SDK for C"
repository = "https://github.com/surrealdb/surrealdb.c"
license = "Apache License 2.0"

[workspace]
members = ["c-tests"]
default-members = ["."]

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
surrealdb = { version = "3.2.4", features = [
    "kv-surrealkv",
    "kv-mem",
    "protocol-http",
] }
surrealdb-core = { version = "3.2.4", features = [
    "http",
    "gql",
] }
tokio = { version = "1.49.0", features = ["full"] }
uuid = "1.19.0"
futures = "0.3.31"
libc = "0.2.172"
chrono = "0.4.43"
async-channel = "2.5.0"
ciborium = "0.2.2"
arc-swap = "1.8.0"
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["serde_derive"] }
geo-types = "0.7.18"
rust_decimal = "1.36"

[build-dependencies]
cbindgen = "0.29.2"
